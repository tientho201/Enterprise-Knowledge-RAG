name: CD — Deploy to production

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"
    tags:
      - "v*.*.*"   # trigger on version tags: v1.0.0, v1.2.3, ...
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/rag-backend

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # CI là quality gate bắt buộc cho đúng commit/tag sắp deploy.
  # Phải truyền permissions đủ cho reusable workflow (checks/PRs) —
  # caller không elevate được thì CI bị startup_failure.
  verify:
    name: Verify release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write
      pull-requests: write

  # ─────────────────────────────────────────────
  # JOB 1: Build & push Docker image
  # ─────────────────────────────────────────────
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 2: Deploy
  # TẮT theo mặc định — chưa có server production. Job này bị SKIP cho tới khi
  # bạn tạo repository variable DEPLOY_ENABLED=true (Settings → Secrets and
  # variables → Actions → Variables). Khi bật, nhớ set kèm 3 secrets:
  #   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
  # DB migrations (Alembic) chạy TRÊN SERVER trong bước deploy bên dưới,
  # dùng DATABASE_URL từ .env.prod trên server — không cần secret GitHub.
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-push
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync production Compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: backend/docker-compose.prod.yml
          target: /opt/rag
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -Eeuo pipefail
            cd /opt/rag

            export GITHUB_REPOSITORY="${{ github.repository }}"
            export RAG_BACKEND_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-push.outputs.image-digest }}"

            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.prod.yml pull api worker beat

            # DB migrations — chạy trên server, dùng DATABASE_URL trong .env.prod
            docker compose -f docker-compose.prod.yml run --rm --no-deps api \
              uv run alembic upgrade head

            docker compose -f docker-compose.prod.yml up -d \
              --remove-orphans \
              --wait \
              --wait-timeout 120 \
              redis neo4j api worker beat

            curl --fail --silent --show-error \
              --retry 5 --retry-delay 5 \
              http://localhost:8000/health

            docker image prune -f

      - name: Notify deploy success
        if: success()
        run: |
          echo "Deployed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-push.outputs.image-digest }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"

      - name: Notify deploy failure
        if: failure()
        run: |
          echo "DEPLOY FAILED — commit ${{ github.sha }}"
          exit 1

  # ─────────────────────────────────────────────
  # Overview — tab Summary trên Actions: luồng CI/CD + chỗ lỗi
  # ─────────────────────────────────────────────
  cd-overview:
    name: CD Overview
    runs-on: ubuntu-latest
    if: always()
    needs: [verify, build-push, deploy]
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Write CD Overview to Actions Summary
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          BUILD_RESULT: ${{ needs.build-push.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅" ;;
              skipped) echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              failure) echo "❌" ;;
              *) echo "❓" ;;
            esac
          }

          V=$(icon "$VERIFY_RESULT")
          B=$(icon "$BUILD_RESULT")
          D=$(icon "$DEPLOY_RESULT")

          if [ "$VERIFY_RESULT" = "failure" ] || [ "$BUILD_RESULT" = "failure" ] || [ "$DEPLOY_RESULT" = "failure" ]; then
            TITLE="## ❌ CD — Overview (có lỗi)"
          else
            TITLE="## ✅ CD — Overview"
          fi

          {
            echo "$TITLE"
            echo ""
            echo "| | Stage | Status | Ý nghĩa / xem lỗi ở đâu |"
            echo "|---|---|---|---|"
            echo "| $V | **Verify release (CI)** | \`$VERIFY_RESULT\` | Chạy full Backend CI (lint → test → docker). Fail → mở job con dưới *Verify release* |"
            echo "| $B | **Build & push image** | \`$BUILD_RESULT\` | Push image lên GHCR. Fail → log *Build & push image* |"
            echo "| $D | **Deploy** | \`$DEPLOY_RESULT\` | SSH deploy (chỉ chạy khi \`DEPLOY_ENABLED=true\`, hiện: \`${DEPLOY_ENABLED:-unset}\`) |"
            echo ""
            echo "### Luồng CI/CD"
            echo '```mermaid'
            echo 'flowchart LR'
            echo "  verify[\"$V Verify CI\"] --> build[\"$B Build & push\"]"
            echo "  build --> deploy[\"$D Deploy\"]"
            echo '```'
            echo ""
            echo "### Cách đọc nhanh"
            echo "1. Mở run này → tab **Summary** (trang này)."
            echo "2. Job đỏ đầu tiên trong chuỗi = chỗ gãy."
            echo "3. Nếu **Verify** đỏ: vào từng job con (*Lint*, *Unit tests*, …) — CI Overview cũng có Summary riêng khi chạy qua reusable workflow."
            echo "4. **Deploy** \`skipped\` là bình thường khi chưa bật biến \`DEPLOY_ENABLED\`."
            echo ""
            echo "Commit: \`${GITHUB_SHA:0:7}\` · Branch/tag: \`$GITHUB_REF_NAME\` · Actor: \`$GITHUB_ACTOR\`"
          } >> "$GITHUB_STEP_SUMMARY"
