name: Backend CI

on:
  push:
    branches: ["develop"]
    paths: ["backend/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: ["main", "develop"]
    paths: ["backend/**", ".github/workflows/ci.yml"]
  workflow_call:
  workflow_dispatch:

# Hủy run cũ khi có push mới lên cùng branch/PR — tiết kiệm runner, tránh race.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.5.x"

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint, format, type check, lockfile & workflow validation
  # ─────────────────────────────────────────────
  lint:
    name: Lint & static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (with built-in cache)
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Verify uv.lock khớp pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format . --check

      - name: Mypy type check
        run: uv run mypy app/

      - name: Validate GitHub workflows (actionlint)
        uses: raven-actions/actionlint@v2
        with:
          # Tắt pyflakes: action tự cài qua pipx và hiện đang lỗi trên runner
          # (pipx yêu cầu uv>=0.9.17, runner chỉ có uv 0.5.31). Workflow của
          # repo không có script Python nhúng nên không cần check này.
          # shellcheck vẫn giữ nguyên (đã có sẵn trên runner, không cần cài).
          pyflakes: false

  # ─────────────────────────────────────────────
  # JOB 2: Unit tests + coverage gate (SQLite, không service ngoài)
  # ─────────────────────────────────────────────
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    env:
      APP_ENV: test
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"
      OPENAI_API_KEY: "sk-test-fake-key-for-ci"
      QDRANT_URL: "http://localhost:6333"
      QDRANT_API_KEY: "test-key"
      NEO4J_URI: "bolt://localhost:7687"
      NEO4J_PASSWORD: "test"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (with built-in cache)
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run unit tests with coverage gate
        run: |
          uv run pytest app/tests/unit/ -v \
            --tb=short \
            --junitxml=reports/unit-results.xml \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=6

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: backend/reports/

  # ─────────────────────────────────────────────
  # JOB 3: Integration tests — auth flow (PostgreSQL + Redis) + Provision layer
  # citation graph (Neo4j service — app/tests/integration/test_provision_graph.py,
  # marker @pytest.mark.neo4j). Qdrant/LocalStack vẫn CHƯA cần: thêm lại khi có
  # integration test ingestion/retrieval qua Qdrant/S3 thực tế.
  # ─────────────────────────────────────────────
  test-integration:
    name: Integration tests (auth + provision graph)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enterprise_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        # Cùng tag major version với Neo4j local (backend/docker-compose.yml:
        # neo4j:5-community). Neo4j Aura (production) là managed service, version
        # cụ thể không lộ qua connection string nên không thể khớp tuyệt đối — rủi ro
        # thấp vì schema dùng ở đây (CREATE CONSTRAINT ... IF NOT EXISTS, MERGE) là
        # cú pháp ổn định xuyên suốt Neo4j 5.x, không dùng cú pháp/APOC đặc thù version.
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/neo4j_password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p neo4j_password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/enterprise_rag_test"
      REDIS_URL: "redis://localhost:6379/0"
      CELERY_BROKER_URL: "redis://localhost:6379/0"
      CELERY_RESULT_BACKEND: "redis://localhost:6379/1"
      OPENAI_API_KEY: "sk-test-fake-key-for-ci"
      QDRANT_URL: "http://localhost:6333"
      QDRANT_API_KEY: "test-key"
      NEO4J_URI: "bolt://localhost:7687"
      NEO4J_PASSWORD: "neo4j_password"
      # Đọc riêng bởi app/tests/integration/test_provision_graph.py — CỐ TÌNH tách
      # khỏi NEO4J_URI/NEO4J_PASSWORD ở trên (dùng bởi settings.NEO4J_URI qua
      # get_neo4j_driver()). Test Provision layer tự tạo driver riêng từ 3 biến này
      # thay vì đọc settings, để không bao giờ vô tình nối vào Neo4j Aura production
      # dù ai đó sau này đổi NEO4J_URI ở trên trỏ ra ngoài CI. Ở đây cả hai cặp cùng
      # trỏ service container neo4j bên trên — CI không bao giờ ghi vào Aura production.
      NEO4J_TEST_URI: "bolt://localhost:7687"
      NEO4J_TEST_USER: "neo4j"
      NEO4J_TEST_PASSWORD: "neo4j_password"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (with built-in cache)
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run Alembic migrations (local Postgres)
        run: uv run alembic upgrade head

      - name: Run integration tests
        run: |
          uv run pytest app/tests/integration/ -v \
            --tb=short \
            --junitxml=reports/integration-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: backend/reports/

  # ─────────────────────────────────────────────
  # JOB 4: Docker build (validate image builds OK, không push)
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: rag-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
