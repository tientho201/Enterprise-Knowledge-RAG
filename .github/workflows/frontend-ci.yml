name: Frontend CI

on:
  push:
    branches: ["develop"]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    branches: ["main", "develop"]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]

# Hủy run cũ khi có push mới lên cùng branch/PR — tiết kiệm runner, tránh race.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

# Quyền tối thiểu: workflow chỉ đọc code, không dùng secret, không ghi vào
# repo, không comment PR.
permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  # ─────────────────────────────────────────────
  # Typecheck + build (không có service ngoài, không cần backend chạy)
  #
  # CHƯA có bước `npm run lint`: code hiện tại còn 16 lỗi ESLint
  # (@typescript-eslint/no-explicit-any, react-hooks/set-state-in-effect) nên
  # bật lint lúc này sẽ làm mọi PR frontend đỏ. Sẽ thêm bước lint sau khi các
  # lỗi đó được sửa — không dùng continue-on-error để che.
  # ─────────────────────────────────────────────
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Next.js build
        env:
          # Giá trị giả cho build — CI không gọi backend. Trùng fallback trong
          # lib/api.ts; URL production được set trên nền tảng deploy.
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"
        run: npm run build
