# Production docker-compose
# Cloud services (không cần container):
#   - PostgreSQL  → Supabase
#   - Storage     → AWS S3
#   - Qdrant      → Qdrant Cloud
#
# Self-hosted (container):
#   - Redis, Neo4j
#
# Env vars inject từ .env.prod — KHÔNG commit file này lên git

x-common-env: &common-env
  env_file: .env.prod
  restart: unless-stopped
  networks:
    - rag-network

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "5"

services:
  # ── API (FastAPI) ──────────────────────────
  api:
    <<: [*common-env, *logging]
    image: ${RAG_BACKEND_IMAGE:-ghcr.io/${GITHUB_REPOSITORY}/rag-backend:main}
    container_name: rag_api
    command: >
      uv run uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers 4
        --proxy-headers
        --forwarded-allow-ips "*"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Celery Worker ──────────────────────────
  worker:
    <<: [*common-env, *logging]
    image: ${RAG_BACKEND_IMAGE:-ghcr.io/${GITHUB_REPOSITORY}/rag-backend:main}
    container_name: rag_worker
    command: >
      uv run celery -A app.workers.celery_app worker
        --loglevel=info
        --concurrency=4
        --queues=ingestion,sync,default
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "celery", "-A", "app.workers.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Celery Beat (scheduler) ────────────────
  beat:
    <<: [*common-env, *logging]
    image: ${RAG_BACKEND_IMAGE:-ghcr.io/${GITHUB_REPOSITORY}/rag-backend:main}
    container_name: rag_beat
    command: >
      uv run celery -A app.workers.celery_app beat
        --loglevel=info
        --scheduler celery.beat:PersistentScheduler
    depends_on:
      redis:
        condition: service_healthy

  # ── Flower (Celery monitoring UI, Task 3.3) ───
  # Lệnh đã ghi sẵn trong backend/CLAUDE.md nhưng chưa từng chạy trong compose —
  # chỉ thêm service, KHÔNG code mới. FLOWER_BASIC_AUTH bắt buộc đặt trong .env.prod
  # (format "user:password") — thiếu biến này Flower expose không auth ra cổng
  # 5555, rủi ro lộ thông tin task (args/kwargs có thể chứa document_id/query).
  flower:
    <<: [*common-env, *logging]
    image: ${RAG_BACKEND_IMAGE:-ghcr.io/${GITHUB_REPOSITORY}/rag-backend:main}
    container_name: rag_flower
    command: >
      uv run celery -A app.workers.celery_app flower
        --port=5555
        --basic-auth=${FLOWER_BASIC_AUTH}
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  # ── Redis ──────────────────────────────────
  redis:
    <<: *logging
    image: redis:7-alpine
    container_name: rag_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j ──────────────────────────────────
  neo4j:
    <<: *logging
    image: neo4j:5-community
    container_name: rag_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  redis_data:
  neo4j_data:
  neo4j_logs:

networks:
  rag-network:
    driver: bridge
