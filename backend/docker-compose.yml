version: "3.9"

# Cloud services (không cần chạy local):
#   - PostgreSQL  → Supabase (https://supabase.com)
#   - Qdrant      → Qdrant Cloud (https://cloud.qdrant.io)
#
# File này chạy các service local:
#   - Redis      (Celery broker + cache)
#   - Neo4j      (knowledge graph — legal cross-reference retrieval)
#   - LocalStack (AWS S3 local — thay thế MinIO)

services:
  redis:
    image: redis:7-alpine
    container_name: rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: rag_neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 5

  localstack:
    image: localstack/localstack:3
    container_name: rag_localstack
    ports:
      - "4566:4566"       # LocalStack Gateway (S3 + tất cả AWS services)
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: 1      # giữ data qua restart
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  neo4j_data:
  neo4j_logs:
  localstack_data:
