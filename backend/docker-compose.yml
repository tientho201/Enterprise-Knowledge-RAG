version: "3.9"

# PostgreSQL và Qdrant đã chuyển lên cloud:
#   - PostgreSQL → Supabase (https://supabase.com)
#   - Qdrant     → Qdrant Cloud (https://cloud.qdrant.io)
#
# File này chỉ còn chạy các service local:
#   - Redis (Celery broker + cache)
#   - MinIO (object storage)

services:
  redis:
    image: redis:7-alpine
    container_name: rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: rag_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  minio_data:
