name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.5.x"

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint & Format
  # ─────────────────────────────────────────────
  lint:
    name: Lint & format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format . --check

      - name: Mypy type check
        run: uv run mypy app/
        continue-on-error: true  # non-blocking until type coverage improves

  # ─────────────────────────────────────────────
  # JOB 2: Unit tests (no external services)
  # ─────────────────────────────────────────────
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      APP_ENV: test
      DEBUG: "false"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"
      REDIS_URL: "redis://localhost:6379/0"
      CELERY_BROKER_URL: "redis://localhost:6379/0"
      CELERY_RESULT_BACKEND: "redis://localhost:6379/1"
      QDRANT_URL: "http://localhost:6333"
      QDRANT_API_KEY: "test-key"
      QDRANT_COLLECTION_NAME: "test_collection"
      SUPABASE_URL: "https://test.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
      SUPABASE_STORAGE_BUCKET: "test-documents"
      NEO4J_URI: "bolt://localhost:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "neo4j_password"
      OPENAI_API_KEY: "sk-test-fake-key-for-ci"
      OPENAI_MODEL: "gpt-4o-mini"
      EMBEDDING_MODEL: "BAAI/bge-m3"
      EMBEDDING_BATCH_SIZE: "4"
      EMBEDDING_DEVICE: "cpu"
      JWT_ALGORITHM: "HS256"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CHUNK_SIZE: "800"
      CHUNK_OVERLAP: "200"
      DENSE_TOP_K: "20"
      GRAPH_TOP_K: "20"
      RERANK_TOP_K: "5"
      DENSE_WEIGHT: "0.7"
      GRAPH_WEIGHT: "0.3"
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      LANGCHAIN_TRACING_V2: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies (no torch — faster CI)
        run: |
          uv sync --frozen --extra dev \
            --no-install-package torch \
            --no-install-package sentence-transformers \
            --no-install-package FlagEmbedding

      - name: Run unit tests
        run: |
          uv run pytest app/tests/unit/ -v \
            --tb=short \
            --junitxml=reports/unit-results.xml \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: reports/

  # ─────────────────────────────────────────────
  # JOB 3: Integration tests (Redis + Neo4j)
  # Supabase Storage được mock — không cần container thật
  # ─────────────────────────────────────────────
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5-community
        ports:
          - 7474:7474
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/neo4j_password
        options: >-
          --health-cmd "neo4j status"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5

    env:
      APP_ENV: test
      DEBUG: "false"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"
      REDIS_URL: "redis://localhost:6379/0"
      CELERY_BROKER_URL: "redis://localhost:6379/0"
      CELERY_RESULT_BACKEND: "redis://localhost:6379/1"
      QDRANT_URL: "http://localhost:6333"
      QDRANT_API_KEY: "test-key"
      QDRANT_COLLECTION_NAME: "test_collection"
      SUPABASE_URL: "https://test.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
      SUPABASE_STORAGE_BUCKET: "test-documents"
      NEO4J_URI: "bolt://localhost:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "neo4j_password"
      OPENAI_API_KEY: "sk-test-fake-key-for-ci"
      OPENAI_MODEL: "gpt-4o-mini"
      EMBEDDING_MODEL: "BAAI/bge-m3"
      EMBEDDING_BATCH_SIZE: "4"
      EMBEDDING_DEVICE: "cpu"
      JWT_ALGORITHM: "HS256"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CHUNK_SIZE: "800"
      CHUNK_OVERLAP: "200"
      DENSE_TOP_K: "20"
      GRAPH_TOP_K: "20"
      RERANK_TOP_K: "5"
      DENSE_WEIGHT: "0.7"
      GRAPH_WEIGHT: "0.3"
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      LANGCHAIN_TRACING_V2: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies (no torch — faster CI)
        run: |
          uv sync --frozen --extra dev \
            --no-install-package torch \
            --no-install-package sentence-transformers \
            --no-install-package FlagEmbedding

      - name: Run integration tests
        run: |
          uv run pytest app/tests/integration/ -v \
            --tb=short \
            --junitxml=reports/integration-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: reports/

  # ─────────────────────────────────────────────
  # JOB 4: Docker build (validate image builds OK)
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rag-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
