name: CD — Deploy to production

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"   # trigger on version tags: v1.0.0, v1.2.3, ...

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/rag-backend

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build & push Docker image
  # ─────────────────────────────────────────────
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 2: Run DB migrations (Alembic)
  # ─────────────────────────────────────────────
  migrate:
    name: DB migrations
    runs-on: ubuntu-latest
    needs: build-push
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (minimal — migrations only)
        run: |
          uv sync --frozen --extra dev \
            --no-install-package torch \
            --no-install-package sentence-transformers \
            --no-install-package FlagEmbedding

      - name: Run Alembic migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run alembic upgrade head

  # ─────────────────────────────────────────────
  # JOB 3: Deploy
  # Điền thông tin server của bạn vào secrets:
  #   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: migrate
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/rag

            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main

            docker compose -f docker-compose.prod.yml up -d \
              --no-deps \
              --remove-orphans \
              api worker

            docker compose -f docker-compose.prod.yml exec -T api \
              curl -sf http://localhost:8000/health || exit 1

            docker image prune -f

      - name: Notify deploy success
        if: success()
        run: |
          echo "Deployed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"

      - name: Notify deploy failure
        if: failure()
        run: |
          echo "DEPLOY FAILED — commit ${{ github.sha }}"
          exit 1
